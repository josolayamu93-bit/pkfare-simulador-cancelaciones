<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PKFARE - Simulador</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
        }

        /* =========================
           LOGIN
        ========================= */

        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                110deg,
                #3f6ff0,
                #35a9dc
            );
        }

        .login-box {
            width: 320px;
            text-align: center;
            color: white;
        }

        .logo-login {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .login-box h1 {
            font-size: 21px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            height: 42px;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 12px;
        }

        .login-box input:first-child {
            border-bottom: 1px solid #ddd;
        }

        .login-button {
            width: 100%;
            height: 42px;
            margin-top: 14px;
            border: none;
            border-radius: 2px;
            background: #32dfb1;
            color: white;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        #login-message {
            margin-top: 15px;
            font-size: 12px;
        }


        /* =========================
           PLATAFORMA
        ========================= */

        #platform {
            display: none;
            width: 100%;
            min-height: 100vh;
            background: #eeeeee;
        }

        .platform-image {
            width: 100%;
            min-height: 100vh;
            object-fit: cover;
            display: block;
        }


        /* =========================
           ANUNCIO
        ========================= */

        #advertisement {
            position: fixed;

            top: 70px;
            left: 50%;

            transform: translateX(-50%);

            width: 630px;
            height: 435px;

            background: white;

            box-shadow: 0 5px 25px rgba(0,0,0,0.35);

            z-index: 10;
        }

        .advertisement-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* X roja */

        .close-ad {
            position: absolute;

            top: 0;
            right: 0;

            width: 28px;
            height: 28px;

            border: none;

            background: #f04444;

            color: white;

            font-size: 20px;

            line-height: 28px;

            cursor: pointer;

            z-index: 20;
        }

        .close-ad:hover {
            background: #d83232;
        }


        /* =========================
           MENSAJE DE CIERRE
        ========================= */

        #closed-message {
            display: none;

            position: fixed;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            background: white;

            padding: 30px 50px;

            box-shadow: 0 3px 15px rgba(0,0,0,0.2);

            font-size: 18px;
        }

    </style>
</head>


<body>


<!-- ==================================
     LOGIN
================================== -->

<div id="login">

    <div class="login-box">

        <div class="logo-login">
            PKFARE
        </div>

        <h1>Bienvenido de nuevo</h1>

        <input
            type="text"
            id="username"
            placeholder="Nombre de usuario / Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            Iniciar sesión
        </button>

        <div id="login-message"></div>

    </div>

</div>



<!-- ==================================
     PLATAFORMA
================================== -->

<div id="platform">

    <img
        src="inicio-pkfare.png"
        class="platform-image"
    >

</div>



<!-- ==================================
     ANUNCIO
================================== -->

<div id="advertisement">

    <img
        src="inicio-pkfare.png"
        class="advertisement-image"
    >

    <button
        class="close-ad"
        onclick="closeAdvertisement()"
    >
        ×
    </button>

</div>



<!-- ==================================
     MENSAJE
================================== -->

<div id="closed-message">

    Anuncio cerrado correctamente.

</div>



<script>

    function login() {

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("login-message");


        if (
            username === "agente.prueba" &&
            password === "123456"
        ) {

            /* Ocultar login */

            document.getElementById("login").style.display =
                "none";


            /* Mostrar plataforma */

            document.getElementById("platform").style.display =
                "block";


            /* Mostrar anuncio */

            document.getElementById("advertisement").style.display =
                "block";


        } else {

            message.innerHTML =
                "✕ Usuario o contraseña incorrectos";

        }

    }



    function closeAdvertisement() {

        document.getElementById("advertisement").style.display =
            "none";

    }

</script>


</body>
</html>
