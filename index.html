<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PKFARE - Simulador de práctica</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eeeeee;
        }

        /* =========================
           LOGIN
        ========================= */

        #login {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                110deg,
                #3f6ff0,
                #35a9dc
            );
        }

        .login-box {
            width: 320px;
            text-align: center;
            color: white;
        }

        .logo-login {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .login-box h1 {
            font-size: 21px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            height: 42px;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 12px;
        }

        .login-box input:first-of-type {
            border-bottom: 1px solid #ddd;
        }

        .login-button {
            width: 100%;
            height: 42px;
            margin-top: 14px;

            border: none;
            border-radius: 2px;

            background: #32dfb1;
            color: white;

            cursor: pointer;
        }

        .login-button:hover {
            opacity: .9;
        }

        #login-message {
            margin-top: 15px;
            font-size: 12px;
        }


        /* =========================
           PLATAFORMA
        ========================= */

        #platform {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }


        /* Imagen de fondo */

        .platform-image {
            width: 100%;
            min-height: 100vh;

            object-fit: cover;

            display: block;
        }


        /* =========================
           BARRA SUPERIOR
        ========================= */

        .top-bar {

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 64px;

            background: #202020;

            display: flex;
            align-items: center;

            padding: 0 25px;

            color: white;

            z-index: 5;
        }


        /* Logo */

        .platform-logo {

            font-size: 23px;
            font-weight: bold;

            margin-right: 45px;

            color: white;
        }


        /* Menú */

        .menu {

            display: flex;
            align-items: center;

            height: 100%;
        }

        .menu-item {

            height: 100%;

            padding: 0 25px;

            display: flex;
            align-items: center;

            cursor: pointer;

            font-size: 14px;

            color: #eeeeee;
        }

        .menu-item:hover {

            background: #2d2d2d;

        }


        /* Opción seleccionada */

        .menu-item.active {

            background: #1684e8;

            color: white;

        }


        /* Espacio derecho */

        .top-right {

            margin-left: auto;

            display: flex;

            align-items: center;

            height: 100%;

            gap: 25px;

            font-size: 13px;

        }


        .top-icon {

            cursor: pointer;

            font-size: 17px;

        }

        .top-icon:hover {

            opacity: .7;

        }


        .user {

            cursor: pointer;

        }


        /* =========================
           ANUNCIO
        ========================= */

        #advertisement {

            position: fixed;

            top: 70px;

            left: 50%;

            transform: translateX(-50%);

            width: 630px;

            height: 435px;

            background: white;

            box-shadow:
                0 5px 25px rgba(0,0,0,.35);

            z-index: 10;

        }

        .advertisement-image {

            width: 100%;
            height: 100%;

            object-fit: cover;

        }


        /* Botón X */

        .close-ad {

            position: absolute;

            top: 0;
            right: 0;

            width: 30px;
            height: 30px;

            border: none;

            background: #f04444;

            color: white;

            font-size: 20px;

            line-height: 30px;

            cursor: pointer;

            z-index: 20;

        }

        .close-ad:hover {

            background: #d83232;

        }

    </style>

</head>


<body>


<!-- =========================
     LOGIN
========================= -->

<div id="login">

    <div class="login-box">

        <div class="logo-login">
            PKFARE
        </div>

        <h1>
            Bienvenido de nuevo
        </h1>

        <input
            type="text"
            id="username"
            placeholder="Nombre de usuario / Correo electrónico"
        >

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            Iniciar sesión
        </button>

        <div id="login-message"></div>

    </div>

</div>



<!-- =========================
     PLATAFORMA
========================= -->

<div id="platform">


    <!-- Imagen actual -->

    <img
        src="inicio-pkfare.png"
        class="platform-image"
    >


    <!-- =========================
         BARRA SUPERIOR REAL
    ========================= -->

    <div class="top-bar">


        <!-- Logo -->

        <div class="platform-logo">
            PKFARE
        </div>


        <!-- Menú -->

        <div class="menu">

            <div
                class="menu-item active"
                onclick="selectMenu(this)"
            >
                Vuelos
            </div>

            <div
                class="menu-item"
                onclick="selectMenu(this)"
            >
                Centro de pedidos
            </div>

        </div>


        <!-- Parte derecha -->

        <div class="top-right">

            <div class="top-icon">
                USD
            </div>

            <div class="top-icon">
                ?
            </div>

            <div class="top-icon">
                🔔
            </div>

            <div class="user">
                agente.prueba
            </div>

        </div>

    </div>


</div>



<!-- =========================
     ANUNCIO
========================= -->

<div
    id="advertisement"
    style="display:none;"
>

    <img
        src="inicio-pkfare.png"
        class="advertisement-image"
    >

    <button
        class="close-ad"
        onclick="closeAdvertisement()"
    >
        ×
    </button>

</div>



<script>


/* =========================
   INICIAR SESIÓN
========================= */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("login-message");


    if (
        username === "agente.prueba" &&
        password === "123456"
    ) {

        document.getElementById("login").style.display =
            "none";

        document.getElementById("platform").style.display =
            "block";

        document.getElementById("advertisement").style.display =
            "block";

    } else {

        message.innerHTML =
            "✕ Usuario o contraseña incorrectos";

    }

}


/* =========================
   CERRAR ANUNCIO
========================= */

function closeAdvertisement() {

    document.getElementById("advertisement").style.display =
        "none";

}


/* =========================
   MENÚ
========================= */

function selectMenu(element) {

    const menuItems =
        document.querySelectorAll(".menu-item");


    menuItems.forEach(function(item) {

        item.classList.remove("active");

    });


    element.classList.add("active");

}

</script>


</body>

</html>
